workflows:
  ios_unsigned:
    name: iOS unsigned build (Minha Carteirinha)
    environment:
      xcode: latest
    scripts:
      - |
        set -e
        echo "🏗️ Arquivando sem assinatura"
        xcodebuild -project minha_carteirinha_app/MinhaCarteirinhaApp.xcodeproj \
          -scheme MinhaCarteirinhaApp \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -archivePath "$PWD/build/App.xcarchive" archive \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

        echo "📦 Empacotando .ipa manual (Payload/.app → .ipa)"
        APP_DIR="$PWD/build/App.xcarchive/Products/Applications"
        APP_NAME=$(ls "$APP_DIR" | head -n 1)  # pega o primeiro .app gerado
        mkdir -p "$PWD/build/ipa/Payload"
        cp -R "$APP_DIR/$APP_NAME" "$PWD/build/ipa/Payload/"

        # Cria o .ipa (zip do diretório Payload)
        cd "$PWD/build/ipa"
        zip -r "MinhaCarteirinhaApp-unsigned.ipa" "Payload"
        echo "✅ IPA gerado em: build/ipa/MinhaCarteirinhaApp-unsigned.ipa"
    artifacts:
      - build/ipa/*.ipa
